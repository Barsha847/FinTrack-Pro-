<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — FinTrack Pro</title>
  <meta name="description" content="Register an account on FinTrack Pro today.">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/dark-theme.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/grid.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/animations.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">

  <!-- CSS password specific guidelines style overrides -->
  <style>
    .strength-meter-container {
      margin-top: 0.5rem;
    }
    .strength-meter-bg {
      height: 6px;
      background-color: var(--border-color);
      border-radius: var(--radius-full);
      overflow: hidden;
      margin-bottom: 0.5rem;
    }
    .strength-meter-bar {
      height: 100%;
      width: 0%;
      transition: width 0.3s ease, background-color 0.3s ease;
      border-radius: var(--radius-full);
    }
    .strength-meter-bar.weak { background-color: var(--color-danger); }
    .strength-meter-bar.fair { background-color: var(--color-warning); }
    .strength-meter-bar.medium { background-color: var(--color-primary); }
    .strength-meter-bar.strong { background-color: var(--color-success); }
    
    .strength-meter-text {
      font-size: var(--fs-xs);
      font-weight: 700;
      text-transform: uppercase;
    }
    .strength-meter-text.weak { color: var(--color-danger); }
    .strength-meter-text.fair { color: var(--color-warning); }
    .strength-meter-text.medium { color: var(--color-primary); }
    .strength-meter-text.strong { color: var(--color-success); }

    .password-rules {
      font-size: var(--fs-xs);
      color: var(--text-secondary);
      margin-top: 0.75rem;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.5rem;
    }
    .password-rule-item {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      transition: color var(--motion-hover);
    }
    .password-rule-item.active {
      color: var(--color-success);
    }
    .password-rule-item i {
      width: 14px;
      height: 14px;
    }
  </style>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <!-- ==========================================
       PRELOADER
       ========================================== -->
  <div class="preloader" id="preloader">
    <div class="preloader-spinner"></div>
    <div class="preloader-logo">FinTrack <span class="text-gradient">Pro</span></div>
  </div>

  <!-- Auth Panel Container -->
  <div class="auth-wrapper" style="padding: 3rem 1.5rem;">
    <!-- Floating Mesh blobs -->
    <div class="auth-bg-shapes">
      <div class="auth-shape auth-shape-1"></div>
      <div class="auth-shape auth-shape-2"></div>
    </div>

    <!-- Theme Switch Absolute Button -->
    <div style="position: absolute; top: 1.5rem; right: 1.5rem; z-index: var(--z-nav);">
      <button class="theme-toggle-btn theme-toggle-trigger-btn" aria-label="Toggle Theme">
        <i data-lucide="moon" class="moon-icon"></i>
        <i data-lucide="sun" class="sun-icon"></i>
      </button>
    </div>

    <!-- Auth Centered Card -->
    <div class="auth-container reveal" style="max-width: 540px;">
      <!-- Logo Header -->
      <div class="auth-logo">
        <a href="../index.html" class="d-flex align-center justify-center gap-2" style="color: var(--text-primary);">
          <i data-lucide="wallet" class="text-gradient" style="font-size: 2rem;"></i>
          <span>FinTrack <span class="text-gradient">Pro</span></span>
        </a>
      </div>

      <div class="card-glass">
        <h3 style="font-weight: 700; text-align: center; margin-bottom: 0.5rem;">Create Account</h3>
        <p style="text-align: center; font-size: var(--fs-sm); margin-bottom: 2rem;">Consolidate your financial footprint today</p>
        
        <form id="signupForm" method="POST" action="login.html" novalidate>
          <div class="grid-12">
            <!-- Full Name -->
            <div class="col-12 col-md-6 form-group">
              <label class="form-label" for="signupName">Full Name</label>
              <div class="form-control-wrapper">
                <i data-lucide="user"></i>
                <input type="text" id="signupName" name="name" class="form-control has-icon" placeholder="John Doe" required>
              </div>
              <div class="error-message"></div>
            </div>

            <!-- Username -->
            <div class="col-12 col-md-6 form-group">
              <label class="form-label" for="signupUsername">Username</label>
              <div class="form-control-wrapper">
                <i data-lucide="at-sign"></i>
                <input type="text" id="signupUsername" name="username" class="form-control has-icon" placeholder="johndoe" required>
              </div>
              <div class="error-message"></div>
            </div>

            <!-- Email -->
            <div class="col-12 col-md-6 form-group">
              <label class="form-label" for="signupEmail">Email Address</label>
              <div class="form-control-wrapper">
                <i data-lucide="mail"></i>
                <input type="email" id="signupEmail" name="email" class="form-control has-icon" placeholder="john@domain.com" required>
              </div>
              <div class="error-message"></div>
            </div>

            <!-- Phone -->
            <div class="col-12 col-md-6 form-group">
              <label class="form-label" for="signupPhone">Phone Number</label>
              <div class="form-control-wrapper">
                <i data-lucide="phone"></i>
                <input type="tel" id="signupPhone" name="phone" class="form-control has-icon" placeholder="+91 98765 43210" required>
              </div>
              <div class="error-message"></div>
            </div>

            <!-- Password -->
            <div class="col-12 form-group" style="margin-bottom: 1rem;">
              <label class="form-label" for="signupPassword">Password</label>
              <div class="form-control-wrapper">
                <i data-lucide="lock"></i>
                <input type="password" id="signupPassword" name="password" class="form-control has-icon has-suffix password-strength-input" placeholder="••••••••" required>
                <button type="button" class="form-suffix-btn password-toggle-btn" aria-label="Toggle password visibility">
                  <i data-lucide="eye"></i>
                </button>
              </div>
              
              <!-- Strength meter bar -->
              <div class="strength-meter-container">
                <div class="strength-meter-bg">
                  <div class="strength-meter-bar"></div>
                </div>
                <div class="d-flex justify-between align-center">
                  <span style="font-size: 11px; color: var(--text-secondary);">Password Strength:</span>
                  <span class="strength-meter-text"></span>
                </div>
              </div>

              <!-- Real-time rules checklist -->
              <div class="password-rules">
                <div class="password-rule-item" data-rule="length">
                  <i data-lucide="circle"></i>
                  <span>8+ characters</span>
                </div>
                <div class="password-rule-item" data-rule="hasUpper">
                  <i data-lucide="circle"></i>
                  <span>Uppercase letter</span>
                </div>
                <div class="password-rule-item" data-rule="hasLower">
                  <i data-lucide="circle"></i>
                  <span>Lowercase letter</span>
                </div>
                <div class="password-rule-item" data-rule="hasDigit">
                  <i data-lucide="circle"></i>
                  <span>Number (0-9)</span>
                </div>
                <div class="password-rule-item" data-rule="hasSpecial">
                  <i data-lucide="circle"></i>
                  <span>Symbol (!@#)</span>
                </div>
              </div>
            </div>

            <!-- Confirm Password -->
            <div class="col-12 form-group">
              <label class="form-label" for="signupConfirmPassword">Confirm Password</label>
              <div class="form-control-wrapper">
                <i data-lucide="lock-keyhole"></i>
                <input type="password" id="signupConfirmPassword" class="form-control has-icon has-suffix confirm-password-input" placeholder="••••••••" required>
                <button type="button" class="form-suffix-btn password-toggle-btn" aria-label="Toggle password visibility">
                  <i data-lucide="eye"></i>
                </button>
              </div>
              <div class="error-message"></div>
            </div>

            <!-- Terms acceptance checkbox -->
            <div class="col-12 form-group" style="margin-bottom: 1.5rem;">
              <label class="form-check">
                <input type="checkbox" name="terms" class="form-check-input terms-checkbox" required>
                <span>I accept the <a href="#" style="font-weight: 600;">Terms & Conditions</a> and <a href="#" style="font-weight: 600;">Privacy Policy</a></span>
              </label>
            </div>

            <!-- Submit Button -->
            <div class="col-12">
              <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; margin-bottom: 1.5rem;">
                Sign Up <i data-lucide="user-plus"></i>
              </button>
            </div>
          </div>
        </form>

        <div style="text-align: center; font-size: var(--fs-sm); color: var(--text-secondary);">
          Already have an account? <a href="login.html" style="font-weight: 600;">Log In</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Entry Script -->
  <script type="module" src="../assets/js/app.js"></script>
</body>
</html>
