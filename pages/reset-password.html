<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — FinTrack Pro</title>
  <meta name="description" content="Set a new password for your FinTrack Pro account.">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/dark-theme.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/grid.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/animations.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">

  <!-- Custom password guidelines style overrides -->
  <style>
    .strength-meter-container {
      margin-top: 0.5rem;
    }
    .strength-meter-bg {
      height: 6px;
      background-color: var(--border-color);
      border-radius: var(--radius-full);
      overflow: hidden;
      margin-bottom: 0.5rem;
    }
    .strength-meter-bar {
      height: 100%;
      width: 0%;
      transition: width 0.3s ease, background-color 0.3s ease;
      border-radius: var(--radius-full);
    }
    .strength-meter-bar.weak { background-color: var(--color-danger); }
    .strength-meter-bar.fair { background-color: var(--color-warning); }
    .strength-meter-bar.medium { background-color: var(--color-primary); }
    .strength-meter-bar.strong { background-color: var(--color-success); }
    
    .strength-meter-text {
      font-size: var(--fs-xs);
      font-weight: 700;
      text-transform: uppercase;
    }
    .strength-meter-text.weak { color: var(--color-danger); }
    .strength-meter-text.fair { color: var(--color-warning); }
    .strength-meter-text.medium { color: var(--color-primary); }
    .strength-meter-text.strong { color: var(--color-success); }

    .password-rules {
      font-size: var(--fs-xs);
      color: var(--text-secondary);
      margin-top: 0.75rem;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.5rem;
    }
    .password-rule-item {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      transition: color var(--motion-hover);
    }
    .password-rule-item.active {
      color: var(--color-success);
    }
    .password-rule-item i {
      width: 14px;
      height: 14px;
    }
  </style>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <!-- ==========================================
       PRELOADER
       ========================================== -->
  <div class="preloader" id="preloader">
    <div class="preloader-spinner"></div>
    <div class="preloader-logo">FinTrack <span class="text-gradient">Pro</span></div>
  </div>

  <!-- Auth Panel Container -->
  <div class="auth-wrapper">
    <!-- Floating Mesh blobs -->
    <div class="auth-bg-shapes">
      <div class="auth-shape auth-shape-1"></div>
      <div class="auth-shape auth-shape-2"></div>
    </div>

    <!-- Theme Switch Absolute Button -->
    <div style="position: absolute; top: 1.5rem; right: 1.5rem; z-index: var(--z-nav);">
      <button class="theme-toggle-btn theme-toggle-trigger-btn" aria-label="Toggle Theme">
        <i data-lucide="moon" class="moon-icon"></i>
        <i data-lucide="sun" class="sun-icon"></i>
      </button>
    </div>

    <!-- Auth Centered Card -->
    <div class="auth-container reveal">
      <!-- Logo Header -->
      <div class="auth-logo">
        <a href="../index.html" class="d-flex align-center justify-center gap-2" style="color: var(--text-primary);">
          <i data-lucide="wallet" class="text-gradient" style="font-size: 2rem;"></i>
          <span>FinTrack <span class="text-gradient">Pro</span></span>
        </a>
      </div>

      <div class="card-glass">
        <h3 style="font-weight: 700; text-align: center; margin-bottom: 0.5rem;">Reset Password</h3>
        <p style="text-align: center; font-size: var(--fs-sm); margin-bottom: 2rem;">Create a strong, unique password to secure your personal ledger.</p>
        
        <form id="resetForm" method="POST" action="login.html" novalidate>
          
          <!-- New Password -->
          <div class="form-group" style="margin-bottom: 1rem;">
            <label class="form-label" for="resetPassword">New Password</label>
            <div class="form-control-wrapper">
              <i data-lucide="lock"></i>
              <input type="password" id="resetPassword" name="password" class="form-control has-icon has-suffix password-strength-input" placeholder="••••••••" required>
              <button type="button" class="form-suffix-btn password-toggle-btn" aria-label="Toggle password visibility">
                <i data-lucide="eye"></i>
              </button>
            </div>
            
            <!-- Strength meter bar -->
            <div class="strength-meter-container">
              <div class="strength-meter-bg">
                <div class="strength-meter-bar"></div>
              </div>
              <div class="d-flex justify-between align-center">
                <span style="font-size: 11px; color: var(--text-secondary);">Password Strength:</span>
                <span class="strength-meter-text"></span>
              </div>
            </div>

            <!-- Checklist rules -->
            <div class="password-rules">
              <div class="password-rule-item" data-rule="length">
                <i data-lucide="circle"></i>
                <span>8+ characters</span>
              </div>
              <div class="password-rule-item" data-rule="hasUpper">
                <i data-lucide="circle"></i>
                <span>Uppercase letter</span>
              </div>
              <div class="password-rule-item" data-rule="hasLower">
                <i data-lucide="circle"></i>
                <span>Lowercase letter</span>
              </div>
              <div class="password-rule-item" data-rule="hasDigit">
                <i data-lucide="circle"></i>
                <span>Number (0-9)</span>
              </div>
              <div class="password-rule-item" data-rule="hasSpecial">
                <i data-lucide="circle"></i>
                <span>Symbol (!@#)</span>
              </div>
            </div>
          </div>

          <!-- Confirm New Password -->
          <div class="form-group">
            <label class="form-label" for="resetConfirmPassword">Confirm New Password</label>
            <div class="form-control-wrapper">
              <i data-lucide="lock-keyhole"></i>
              <input type="password" id="resetConfirmPassword" class="form-control has-icon has-suffix confirm-password-input" placeholder="••••••••" required>
              <button type="button" class="form-suffix-btn password-toggle-btn" aria-label="Toggle password visibility">
                <i data-lucide="eye"></i>
              </button>
            </div>
            <div class="error-message"></div>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; margin-top: 1rem; margin-bottom: 1.5rem;">
            Save Password & Log In <i data-lucide="save"></i>
          </button>
        </form>

        <div style="text-align: center; font-size: var(--fs-sm); color: var(--text-secondary);">
          Abort reset? <a href="login.html" style="font-weight: 600;">Cancel & Return</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Entry Script -->
  <script type="module" src="../assets/js/app.js"></script>
</body>
</html>
