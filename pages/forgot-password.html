<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — FinTrack Pro</title>
  <meta name="description" content="Recover your FinTrack Pro account.">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/dark-theme.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/grid.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/animations.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <!-- ==========================================
       PRELOADER
       ========================================== -->
  <div class="preloader" id="preloader">
    <div class="preloader-spinner"></div>
    <div class="preloader-logo">FinTrack <span class="text-gradient">Pro</span></div>
  </div>

  <!-- Auth Panel Container -->
  <div class="auth-wrapper">
    <!-- Floating Mesh blobs -->
    <div class="auth-bg-shapes">
      <div class="auth-shape auth-shape-1"></div>
      <div class="auth-shape auth-shape-2"></div>
    </div>

    <!-- Theme Switch Absolute Button -->
    <div style="position: absolute; top: 1.5rem; right: 1.5rem; z-index: var(--z-nav);">
      <button class="theme-toggle-btn theme-toggle-trigger-btn" aria-label="Toggle Theme">
        <i data-lucide="moon" class="moon-icon"></i>
        <i data-lucide="sun" class="sun-icon"></i>
      </button>
    </div>

    <!-- Auth Centered Card -->
    <div class="auth-container reveal">
      <!-- Logo Header -->
      <div class="auth-logo">
        <a href="../index.html" class="d-flex align-center justify-center gap-2" style="color: var(--text-primary);">
          <i data-lucide="wallet" class="text-gradient" style="font-size: 2rem;"></i>
          <span>FinTrack <span class="text-gradient">Pro</span></span>
        </a>
      </div>

      <div class="card-glass">
        <h3 style="font-weight: 700; text-align: center; margin-bottom: 0.5rem;">Recover Password</h3>
        <p style="text-align: center; font-size: var(--fs-sm); margin-bottom: 2rem;">Enter your email below to receive a 6-digit OTP verification code.</p>
        
        <form id="forgotForm" method="POST" action="otp.html" novalidate>
          
          <!-- Email Input -->
          <div class="form-group">
            <label class="form-label" for="forgotEmail">Email Address</label>
            <div class="form-control-wrapper">
              <i data-lucide="mail"></i>
              <input type="email" id="forgotEmail" name="email" class="form-control has-icon" placeholder="name@domain.com" required>
            </div>
            <div class="error-message"></div>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; margin-top: 1rem; margin-bottom: 1.5rem;">
            Send OTP Code <i data-lucide="arrow-right"></i>
          </button>
        </form>

        <div style="text-align: center; font-size: var(--fs-sm); color: var(--text-secondary);">
          Remember your password? <a href="login.html" style="font-weight: 600;">Back to Log In</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Entry Script -->
  <script type="module" src="../assets/js/app.js"></script>
</body>
</html>
