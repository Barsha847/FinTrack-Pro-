<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTP Verification — FinTrack Pro</title>
  <meta name="description" content="Verify your identity on FinTrack Pro.">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/dark-theme.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/grid.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/animations.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">

  <!-- Custom OTP Styling overrides -->
  <style>
    .otp-digit {
      width: 50px;
      height: 60px;
      font-size: var(--fs-xl);
      font-family: var(--font-display);
      font-weight: 700;
      text-align: center;
      padding: 0;
      border-radius: var(--radius-md);
      background-color: rgba(255, 255, 255, 0.4);
    }
    [data-theme="dark"] .otp-digit {
      background-color: rgba(9, 9, 11, 0.4);
    }
    .otp-digit:focus {
      background-color: var(--bg-card-hover);
      border-color: var(--color-primary);
      box-shadow: var(--shadow-glow);
    }
    .otp-resend-container {
      font-size: var(--fs-xs);
      color: var(--text-secondary);
      text-align: center;
      margin-top: 1.5rem;
    }
    .otp-resend-link {
      background: none;
      border: none;
      color: var(--color-primary);
      font-weight: 700;
      cursor: pointer;
      opacity: 0.5;
      pointer-events: none;
      transition: opacity var(--motion-hover), color var(--motion-hover);
    }
    .otp-resend-link.active {
      opacity: 1;
      pointer-events: auto;
    }
    .otp-resend-link.active:hover {
      color: var(--color-primary-hover);
    }
  </style>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <!-- ==========================================
       PRELOADER
       ========================================== -->
  <div class="preloader" id="preloader">
    <div class="preloader-spinner"></div>
    <div class="preloader-logo">FinTrack <span class="text-gradient">Pro</span></div>
  </div>

  <!-- Auth Panel Container -->
  <div class="auth-wrapper">
    <!-- Floating Mesh blobs -->
    <div class="auth-bg-shapes">
      <div class="auth-shape auth-shape-1"></div>
      <div class="auth-shape auth-shape-2"></div>
    </div>

    <!-- Theme Switch Absolute Button -->
    <div style="position: absolute; top: 1.5rem; right: 1.5rem; z-index: var(--z-nav);">
      <button class="theme-toggle-btn theme-toggle-trigger-btn" aria-label="Toggle Theme">
        <i data-lucide="moon" class="moon-icon"></i>
        <i data-lucide="sun" class="sun-icon"></i>
      </button>
    </div>

    <!-- Auth Centered Card -->
    <div class="auth-container reveal">
      <!-- Logo Header -->
      <div class="auth-logo">
        <a href="../index.html" class="d-flex align-center justify-center gap-2" style="color: var(--text-primary);">
          <i data-lucide="wallet" class="text-gradient" style="font-size: 2rem;"></i>
          <span>FinTrack <span class="text-gradient">Pro</span></span>
        </a>
      </div>

      <div class="card-glass">
        <h3 style="font-weight: 700; text-align: center; margin-bottom: 0.5rem;">Verify Identity</h3>
        <p style="text-align: center; font-size: var(--fs-sm); margin-bottom: 2rem;">Enter the 6-digit OTP verification code sent to your registered email address.</p>
        
        <form id="otpForm" method="POST" action="reset-password.html" novalidate>
          
          <!-- Code Digits Group -->
          <div style="display: flex; gap: 0.5rem; justify-content: center; margin-bottom: 2rem;">
            <input type="text" class="form-control otp-digit" maxlength="1" pattern="[0-9]" inputmode="numeric" required aria-label="Digit 1">
            <input type="text" class="form-control otp-digit" maxlength="1" pattern="[0-9]" inputmode="numeric" required aria-label="Digit 2">
            <input type="text" class="form-control otp-digit" maxlength="1" pattern="[0-9]" inputmode="numeric" required aria-label="Digit 3">
            <input type="text" class="form-control otp-digit" maxlength="1" pattern="[0-9]" inputmode="numeric" required aria-label="Digit 4">
            <input type="text" class="form-control otp-digit" maxlength="1" pattern="[0-9]" inputmode="numeric" required aria-label="Digit 5">
            <input type="text" class="form-control otp-digit" maxlength="1" pattern="[0-9]" inputmode="numeric" required aria-label="Digit 6">
          </div>

          <!-- Hidden composite input -->
          <input type="hidden" id="otpCode" name="otp" required>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; margin-bottom: 1rem;">
            Verify OTP Code <i data-lucide="shield-check"></i>
          </button>
        </form>

        <!-- Timer & Resend Trigger -->
        <div class="otp-resend-container">
          <div style="margin-bottom: 0.5rem;">
            Code expires in: <span id="otpTimer" style="font-weight: 700; font-family: var(--font-display); color: var(--color-danger);">02:00</span>
          </div>
          <div>
            Didn't receive the code? 
            <button type="button" id="otpResendBtn" class="otp-resend-link">Resend Code</button>
          </div>
        </div>

        <div style="text-align: center; font-size: var(--fs-sm); color: var(--text-secondary); margin-top: 2rem;">
          <a href="login.html" style="font-weight: 600;"><i data-lucide="arrow-left" style="width: 14px; height: 14px; vertical-align: middle; margin-right: 0.25rem;"></i> Back to Log In</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Entry Script -->
  <script type="module" src="../assets/js/app.js"></script>
</body>
</html>
